<!-- 頭上對話框尾巴（2 倍解析度，56×64）。尖端在左下，頂部 10px 是白色「蓋板」：
     疊在主體下緣上，把那一段黑框蓋掉，看起來就是從框裡長出來的開口。程式依方向左右／上下翻轉。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="56" height="64" viewBox="0 0 56 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <polygon points="2,0 54,0 54,10 10,61 4,10 2,10" fill="#FFFFFF"/>
  <polyline points="4,8 10,61 54,8" fill="none" stroke="#141414" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
